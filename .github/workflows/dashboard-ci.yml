name: Dashboard browser quality

on:
  push:
    paths: ['backend/**', '.github/workflows/dashboard-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/dashboard-ci.yml']

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      CI: 'true'
      APP_ENV: testing
      NIGHTWATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          extensions: calendar, curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, redis, zip, pcntl, posix
          coverage: none
          tools: composer:2.10.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked tooling
        run: |
          npm install --global npm@10.9.3
          npm ci
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npx playwright install --with-deps chromium
      - name: Authenticated RTL, responsive, mutation and axe checks
        run: |
          npm run test:authoring-draft
          npm run test:dashboard
      - name: Lighthouse on authenticated dashboard pages
        run: npm run measure:dashboard
      - name: Keep screenshots, traces and measurement reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticated-dashboard-quality
          path: |
            backend/playwright-report
            backend/test-results
            backend/.lighthouseci
          retention-days: 7
