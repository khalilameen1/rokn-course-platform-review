name: Refresh iOS dependency lock

on:
  workflow_dispatch:
    inputs:
      skip_linux_android:
        description: Reuse the already-published Linux Android lock refresh
        required: false
        type: boolean
        default: false
      reuse_native_locks:
        description: Reuse committed native locks and refresh legal provenance only
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-ios-lock
  cancel-in-progress: false

jobs:
  refresh-android:
    if: ${{ !inputs.skip_linux_android && !inputs.reuse_native_locks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://rokn-course-platform-review-production-b7gpy1.laravel.cloud/api/v1/
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: play
      EXPO_PUBLIC_BUILD_PROFILE: production
      EXPO_PUBLIC_REQUIRE_FEATURE_FLAGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
          cache: gradle
      - name: Resolve the complete Linux production metadata closure
        run: |
          npm install --global npm@10.9.3
          npm ci --include=dev
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/metadata-upload.jks" \
            -storepass ci-password -keypass ci-password -alias ci-upload \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Rokn Metadata CI"
          cd android
          ./gradlew -q :app:lintRelease :app:testReleaseUnitTest :app:bundleRelease \
            --no-daemon --refresh-dependencies \
            --write-locks \
            -PreactNativeArchitectures=arm64-v8a \
            -ProknDistributionChannel=play \
            -ProknBuildProfile=production \
            -ProknRequireReleaseSigning=true \
            -ProknRequireApiUrl=true \
            -ProknEnableMinify=true \
            -ProknEnableResourceShrink=true \
            "-PUPLOAD_STORE_FILE=$RUNNER_TEMP/metadata-upload.jks" \
            -PUPLOAD_STORE_PASSWORD=ci-password \
            -PUPLOAD_KEY_ALIAS=ci-upload \
            -PUPLOAD_KEY_PASSWORD=ci-password \
            --write-verification-metadata sha256
      - name: Commit the Linux dependency verification metadata
        working-directory: .
        run: |
          git config user.name "Rokn Release Automation"
          git config user.email "roknproduction@gmail.com"
          git add \
            mobile/android/app/gradle.lockfile \
            mobile/android/buildscript-gradle.lockfile \
            mobile/android/settings-gradle.lockfile \
            mobile/android/gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Linux dependency verification metadata is already current."
          else
            git commit -m "Refresh Linux Android dependency verification"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  refresh:
    needs: refresh-android
    if: ${{ always() && (needs.refresh-android.result == 'success' || needs.refresh-android.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.6
      - name: Install JavaScript and Ruby dependencies
        working-directory: mobile
        run: |
          npm install --global npm@10.9.3
          npm ci --include=dev
          gem install bundler --version 4.0.20 --no-document
          bundle _4.0.20_ update --bundler=4.0.20
          bundle _4.0.20_ install
      - name: Regenerate native locks and macOS verification metadata
        if: ${{ !inputs.reuse_native_locks }}
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://rokn-course-platform-review-production-b7gpy1.laravel.cloud/api/v1/
        run: |
          cd android
          ./gradlew -q \
            -I ../scripts/android-license-inventory.init.gradle \
            :app:roknResolvedReleaseLicenseInputs \
            -ProknDistributionChannel=direct \
            -ProknBuildProfile=test \
            "-ProknLicenseInventoryOutput=$RUNNER_TEMP/android-license-inputs.json" \
            --write-verification-metadata sha256
          test -s "$RUNNER_TEMP/android-license-inputs.json"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/metadata-upload.jks" \
            -storepass ci-password -keypass ci-password -alias ci-upload \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Rokn Metadata CI"
          ./gradlew -q :app:lintRelease :app:testReleaseUnitTest :app:bundleRelease \
            --no-daemon --refresh-dependencies \
            --write-locks \
            -PreactNativeArchitectures=arm64-v8a \
            -ProknDistributionChannel=play \
            -ProknBuildProfile=production \
            -ProknRequireReleaseSigning=true \
            -ProknRequireApiUrl=true \
            -ProknEnableMinify=true \
            -ProknEnableResourceShrink=true \
            "-PUPLOAD_STORE_FILE=$RUNNER_TEMP/metadata-upload.jks" \
            -PUPLOAD_STORE_PASSWORD=ci-password \
            -PUPLOAD_KEY_ALIAS=ci-upload \
            -PUPLOAD_KEY_PASSWORD=ci-password \
            --write-verification-metadata sha256
          cd ..
          node --test scripts/tests/gradle-dependency-provenance.test.js
          cd ios
          rm -rf Pods Podfile.lock
          bundle _4.0.20_ exec pod install
          cd ..
          npm run verify:ios-lock
      - name: Commit native locks before the slower legal inventory
        if: ${{ !inputs.reuse_native_locks }}
        run: |
          git config user.name "Rokn Release Automation"
          git config user.email "roknproduction@gmail.com"
          git add \
            mobile/Gemfile.lock \
            mobile/ios/Podfile.lock \
            mobile/android/app/gradle.lockfile \
            mobile/android/buildscript-gradle.lockfile \
            mobile/android/settings-gradle.lockfile \
            mobile/android/gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Native locks are already current."
          else
            git commit -m "Refresh native dependency locks"
            had_refresh_changes=0
            if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
              git stash push --include-untracked -m native-lock-refresh-working-tree
              had_refresh_changes=1
            fi
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            if test "$had_refresh_changes" = 1; then
              git stash pop
            fi
          fi
      - name: Restore the installed CocoaPods sandbox from committed locks
        if: ${{ inputs.reuse_native_locks }}
        working-directory: mobile
        run: |
          cd ios
          bundle _4.0.20_ exec pod install --deployment
          cd ..
          npm run verify:ios-lock
          git diff --exit-code -- ios/Podfile.lock
      - name: Regenerate native legal provenance
        working-directory: mobile
        run: |
          npm run notices:native:generate
          npm run licenses:native:check
      - name: Commit the generated legal provenance
        run: |
          git config user.name "Rokn Release Automation"
          git config user.email "roknproduction@gmail.com"
          git add mobile
          if git diff --cached --quiet; then
            echo "Native legal provenance is already current."
            exit 0
          fi
          git commit -m "Refresh native legal provenance"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
