name: Secret scan

# gitleaks (https://github.com/gitleaks/gitleaks, MIT) scans every commit for
# 150+ known credential formats. It runs beside mobile/scripts/
# verify-repository-secrets.js, which owns what gitleaks does not know:
# sensitive file types (.env, keystores, p12) and Rokn's own secret names.
# Reviewed exceptions live in .gitleaks.toml and .gitleaksignore.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, khalil, codex/launch-fixes-20261017]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned gitleaks release
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan the full history
        # --redact keeps any finding's value out of public logs.
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
